name: AKS connection test
on: workflow_dispatch
jobs:
  default-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: CLI version
        run: az version --query '"azure-cli"' -o tsv
      - name: get-credentials (default CLI)
        run: |
          az aks get-credentials -g "${{ vars.AKS_RESOURCE_GROUP }}" -n "${{ vars.AKS_CLUSTER_NAME }}" --overwrite-existing --debug 2>&1 | tail -40
        continue-on-error: true

  pinned-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: get-credentials (pinned CLI)
        uses: azure/cli@v2
        with:
          azcliversion: 2.89.0
          inlineScript: |
            az aks get-credentials -g "${{ vars.AKS_RESOURCE_GROUP }}" -n "${{ vars.AKS_CLUSTER_NAME }}" --file "$GITHUB_WORKSPACE/kubeconfig" --overwrite-existing
            ls -l "$GITHUB_WORKSPACE/kubeconfig"